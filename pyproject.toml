[project]
name = "pyraya"
version = "0.1.0-alpha.5"
license = "MIT"
license-files = ["LICENSE"]
description = "PyRaya is a reusable, self-contained Qt text editor widget written in Python (PySide6)"
readme = "README.md"
authors = [
    { name = "RoXimn", email = "roximn148@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.5",
    "pyside6>=6.11.2",
    "romanalfaz>=0.1.0a4",
]

[project.scripts]
pyraya = "pyraya:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pyraya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.14"
