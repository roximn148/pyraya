[project]
name = "pyraya"
version = "0.1.0a10"
description = "PyRaya is a reusable, self-contained Urdu-first QPlainTextEdit widget written in Python (PySide6)"

readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "RoXimn", email = "roximn148@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]

requires-python = ">=3.13"
dependencies = [
    "pyside6-essentials>=6.12.0",
    "romanalfaz>=0.1.0a12",
]

[project.scripts]
pyraya = "pyraya:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pyraya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.13"
